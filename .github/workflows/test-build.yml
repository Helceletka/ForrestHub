name: Test Build

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build-windows:
    permissions: write-all
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Install setuptools
      - name: Install setuptools
        run: |
          python -m pip install --upgrade pip
          pip install setuptools

      # Get version from VERSION file and date (PowerShell)
      - name: Get version and date
        run: |
          cd ForrestHub-app
          $version = Get-Content VERSION
          echo "VERSION=$version" >> $env:GITHUB_ENV
          $dateStr = Get-Date -Format "yyyyMMdd"
          echo "DATESTR=$dateStr" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd ForrestHub-app
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd ForrestHub-app
          pyinstaller pyinstaller.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForrestHub-Windows-${{ env.VERSION }}-${{ env.DATESTR }}
          path: ForrestHub-app/dist/ForrestHub.exe

  build-macos:
    permissions: write-all
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Install Hatch
      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install setuptools

      # Get version from VERSION file and date (bash)
      - name: Get version and date
        run: |
          cd ForrestHub-app
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          DATESTR=$(date +'%Y%m%d')
          echo "DATESTR=$DATESTR" >> $GITHUB_ENV
        shell: bash

      - name: Install dependencies and build
        run: |
          python -m pip install --upgrade pip
          cd ForrestHub-app
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd ForrestHub-app
          pyinstaller pyinstaller.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForrestHub-macOS-${{ env.VERSION }}-${{ env.DATESTR }}
          path: ForrestHub-app/dist/ForrestHub
