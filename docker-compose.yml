services:
  forresthub:
    build:
      context: ./ForrestHub-app
      dockerfile: Dockerfile
    image: forresthub:local
    container_name: forresthub
    restart: unless-stopped
    ports:
      - "${FH_PUBLISH_PORT:-4444}:${FH_PORT:-4444}"
    environment:
      # Server bind address inside the container
      FH_HOST: ${FH_HOST:-0.0.0.0}
      # Internal port the Flask/SocketIO server listens on
      FH_PORT: ${FH_PORT:-4444}
      # Public host shown in QR codes (e.g. fh.helceletka.cz)
      FH_HOST_QR: ${FH_HOST_QR:-fh.helceletka.cz}
      # When set to any value, runs with --server (no reloader)
      FH_SERVER: ${FH_SERVER:-1}
      # Optional: pass any extra raw CLI args
      FH_EXTRA_ARGS: ${FH_EXTRA_ARGS:-}
      # Persisted data directory inside the container (matches the volume below)
      FH_DATA_DIR: /app/data
      # Read by config.py / Flask
      PORT: ${FH_PORT:-4444}
      HOST_QR: ${FH_HOST_QR:-fh.helceletka.cz}
    volumes:
      - forresthub_data:/app/data
      - forresthub_logs:/app/ForrestHub-logs
      - forresthub_games:/app/ForrestHub-games

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: forresthub-code-server
    restart: unless-stopped
    ports:
      - "${CODE_SERVER_PUBLISH_PORT:-8443}:8443"
    environment:
      PUID: ${CODE_SERVER_PUID:-1000}
      PGID: ${CODE_SERVER_PGID:-1000}
      TZ: ${CODE_SERVER_TZ:-Europe/Prague}
      PASSWORD: ${CODE_SERVER_PASSWORD:-changeme}
      SUDO_PASSWORD: ${CODE_SERVER_SUDO_PASSWORD:-}
      PROXY_DOMAIN: ${CODE_SERVER_PROXY_DOMAIN:-}
      DEFAULT_WORKSPACE: /config/workspace
    volumes:
      - code_server_config:/config
      # Mount the ForrestHub state under the code-server workspace so it's
      # visible/editable in the browser IDE.
      - forresthub_data:/config/workspace/forresthub-data
      - forresthub_logs:/config/workspace/forresthub-logs
      - forresthub_games:/config/workspace/forresthub-games

volumes:
  forresthub_data:
  forresthub_logs:
  forresthub_games:
  code_server_config:
